services:
  - type: web
    name: sales-analytics-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sales-analytics-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: REDIS_URL
        value: memory://
databases:
  - name: sales-analytics-db
    plan: free
    ipAllowList: []
